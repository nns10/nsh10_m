<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f7">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>하루 생활비 가계부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f7;--card:#fff;--ink:#5b2a40;--sub:#94687b;--line:#f4d5e0;--acc:#d6457f;--accbg:#fde3ec;--warn:#c0392b;--warnbg:#ffe9d6;--coin:#e8639a;--hero:#f7b9cd;--track:rgba(255,255,255,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2a1620;--card:#3a1f2d;--ink:#fbe4ed;--sub:#d6a3b7;--line:#5a3446;--acc:#ff9cc0;--accbg:#4a2638;--warn:#ffb38a;--warnbg:#4a2a22;--coin:#ff9cc0;--hero:#7a3d58;--track:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2a1620;--card:#3a1f2d;--ink:#fbe4ed;--sub:#d6a3b7;--line:#5a3446;--acc:#ff9cc0;--accbg:#4a2638;--warn:#ffb38a;--warnbg:#4a2a22;--coin:#ff9cc0;--hero:#7a3d58;--track:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:18px;font-weight:700;margin:4px 0 16px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.row{display:flex;gap:8px}
.col{flex:1;min-width:0}
input,select{width:100%;font:inherit;font-size:16px;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:#f3bcd1;background:color-mix(in srgb,var(--acc) 40%,var(--card));color:var(--ink);cursor:pointer;white-space:nowrap;touch-action:manipulation}
button.ghost{background:transparent;color:var(--sub);padding:8px 12px;font-weight:500}
.hero{background:var(--hero);color:var(--ink);border:0}
.hero .t{font-size:14px;opacity:.75}
.hero .big{font-size:clamp(40px,13vw,58px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.4em;font-weight:500;margin-left:4px;opacity:.8}
.hero .s{font-size:14px;opacity:.85}
.hero.over .big{color:var(--warn)}
.bar{height:10px;border-radius:6px;background:var(--track);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coin);border-radius:6px;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--accbg);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.stat.w{background:var(--warnbg)}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
li .m{flex:1;min-width:0;overflow-wrap:anywhere}
li .d{font-size:12px;color:var(--sub)}
li .a{font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--sub);font-size:14px;margin:10px 0 0}
.hint{font-size:13px;color:var(--sub);margin-top:10px}
.hint.err{color:var(--warn)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:16px}
.cal-h button{min-width:48px;font-size:22px}
.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:12px;color:var(--sub);padding-bottom:2px}
.wk span:first-child{color:var(--warn)}
.cd{min-height:62px;border-radius:8px;padding:5px 1px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;cursor:pointer;touch-action:manipulation}
.cd:focus-visible{outline:2px solid var(--acc)}
.cd.s{outline:2px solid var(--coin);outline-offset:-2px}
.cd.p{background:var(--accbg)}
.cd.e{border-color:var(--acc);font-weight:700}
.cd.t{background:var(--hero);color:var(--ink);font-weight:700}
.cd em{font-style:normal;font-size:10px;color:var(--acc);line-height:1.1}
.cd.t em{color:var(--ink)}
.cd i{font-style:normal;font-size:10px;color:var(--warn);font-weight:700;line-height:1.1}
.cd.t i{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin-top:10px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;text-decoration:none}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dt{width:5px;height:5px;border-radius:50%;background:var(--warn)}
.dt.in{background:#3a9d77}
.detail{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dt-t{font-weight:700;margin-bottom:6px}
.dr{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.dr.big{font-size:16px;font-weight:700}
.dr.sub{color:var(--sub);font-size:13px;padding-left:12px}
.dr b{font-variant-numeric:tabular-nums}
.dr b.w{color:var(--warn)}
.dr b.g{color:#3a9d77}
.dsum{
