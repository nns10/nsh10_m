<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff3f7">
<meta name="apple-mobile-web-app-title" content="가계부">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>하루 생활비 가계부</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff3f7;--card:#fff;--ink:#5b2a40;--sub:#94687b;--line:#f4d5e0;--acc:#d6457f;--accbg:#fde3ec;--warn:#c0392b;--warnbg:#ffe9d6;--coin:#e8639a;--hero:#f7b9cd;--track:rgba(255,255,255,.55);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#2a1620;--card:#3a1f2d;--ink:#fbe4ed;--sub:#d6a3b7;--line:#5a3446;--acc:#ff9cc0;--accbg:#4a2638;--warn:#ffb38a;--warnbg:#4a2a22;--coin:#ff9cc0;--hero:#7a3d58;--track:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#2a1620;--card:#3a1f2d;--ink:#fbe4ed;--sub:#d6a3b7;--line:#5a3446;--acc:#ff9cc0;--accbg:#4a2638;--warn:#ffb38a;--warnbg:#4a2a22;--coin:#ff9cc0;--hero:#7a3d58;--track:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:18px;font-weight:700;margin:4px 0 16px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.row{display:flex;gap:8px}
.col{flex:1;min-width:0}
input,select{width:100%;font:inherit;font-size:16px;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;min-height:44px;background:#f3bcd1;background:color-mix(in srgb,var(--acc) 40%,var(--card));color:var(--ink);cursor:pointer;white-space:nowrap;touch-action:manipulation}
button.ghost{background:transparent;color:var(--sub);padding:8px 12px;font-weight:500}
.hero{background:var(--hero);color:var(--ink);border:0}
.hero .t{font-size:14px;opacity:.75}
.hero .big{font-size:clamp(40px,13vw,58px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hero .big small{font-size:.4em;font-weight:500;margin-left:4px;opacity:.8}
.hero .s{font-size:14px;opacity:.85}
.hero.over .big{color:var(--warn)}
.bar{height:10px;border-radius:6px;background:var(--track);margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--coin);border-radius:6px;transition:width .3s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--accbg);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--sub)}
.stat.w{background:var(--warnbg)}
ul{list-style:none;margin:12px 0 0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
li .m{flex:1;min-width:0;overflow-wrap:anywhere}
li .d{font-size:12px;color:var(--sub)}
li .a{font-weight:700;font-variant-numeric:tabular-nums}
.empty{color:var(--sub);font-size:14px;margin:10px 0 0}
.hint{font-size:13px;color:var(--sub);margin-top:10px}
.hint.err{color:var(--warn)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-h b{font-size:16px}
.cal-h button{min-width:48px;font-size:22px}
.wk,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:12px;color:var(--sub);padding-bottom:2px}
.wk span:first-child{color:var(--warn)}
.cd{min-height:62px;border-radius:8px;padding:5px 1px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent;cursor:pointer;touch-action:manipulation}
.cd:focus-visible{outline:2px solid var(--acc)}
.cd.s{outline:2px solid var(--coin);outline-offset:-2px}
.cd.p{background:var(--accbg)}
.cd.e{border-color:var(--acc);font-weight:700}
.cd.t{background:var(--hero);color:var(--ink);font-weight:700}
.cd em{font-style:normal;font-size:10px;color:var(--acc);line-height:1.1}
.cd.t em{color:var(--ink)}
.cd i{font-style:normal;font-size:10px;color:var(--warn);font-weight:700;line-height:1.1}
.cd.t i{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub);margin-top:10px}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;text-decoration:none}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dt{width:5px;height:5px;border-radius:50%;background:var(--warn)}
.dt.in{background:#3a9d77}
.detail{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dt-t{font-weight:700;margin-bottom:6px}
.dr{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:14px}
.dr.big{font-size:16px;font-weight:700}
.dr.sub{color:var(--sub);font-size:13px;padding-left:12px}
.dr b{font-variant-numeric:tabular-nums}
.dr b.w{color:var(--warn)}
.dr b.g{color:#3a9d77}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;background:transparent;color:var(--sub);border:1px solid var(--line)}
.seg button.on{background:var(--accbg);color:var(--ink);border-color:var(--acc)}
.cd u{text-decoration:none;font-size:10px;font-weight:700;color:#3a9d77;line-height:1.1}
li .a.in{color:#3a9d77}
@media (max-width:420px){
  main{padding:14px 10px 32px}
  .card{padding:14px;border-radius:14px}
  .cg,.wk{gap:2px}
  .cd{min-height:58px;font-size:12px;padding:4px 0}
  .cd em,.cd i,.cd u{font-size:9px}
  .stat{padding:10px 12px}
  .stat b{font-size:17px}
  li{gap:2px}
  li .a{font-size:14px}
}
</style>
</head>
<body>
<main>
  <h1>하루 생활비 가계부</h1>

  <section class="card">
    <div class="cal-h">
      <button class="ghost" id="calPrev" type="button" aria-label="이전 달">‹</button>
      <b id="calTitle"></b>
      <button class="ghost" id="calNext" type="button" aria-label="다음 달">›</button>
    </div>
    <div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
    <div class="cg" id="calGrid"></div>
    <div class="legend"><span><s style="background:var(--accbg)"></s>쓰는 기간</span><span><s style="background:var(--hero)"></s>오늘</span><span><s style="background:var(--acc)"></s>그날 남은 돈 (쓴 돈 뺀 금액)</span><span><s style="background:var(--warn);border-radius:50%"></s>쓴 돈</span><span><s style="background:#3a9d77;border-radius:50%"></s>추가 수입</span></div>
    <div class="detail" id="detail"></div>
  </section>

  <section class="card">
    <label for="periodSel">기간별 생활비</label>
    <select id="periodSel" style="margin-bottom:14px"></select>
    <label for="budget">이 기간 생활비 (원)</label>
    <input id="budget" inputmode="numeric" placeholder="예: 900000" autocomplete="off" style="margin-bottom:14px">
    <div class="row">
      <div class="col"><label for="start">시작일</label><input id="start" type="date"></div>
      <div class="col"><label for="end">종료일</label><input id="end" type="date"></div>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="setBtn" type="button" style="flex:1">저장</button>
      <button id="addPeriod" type="button">새 기간</button>
      <button class="ghost" id="delPeriod" type="button">삭제</button>
    </div>
    <div class="hint" id="periodInfo"></div>
  </section>

  <section class="card hero" id="hero">
    <div class="t">오늘 쓸 수 있는 돈</div>
    <div class="big"><span id="today">0</span><small>원</small></div>
    <div class="s" id="todaySub"></div>
    <div class="bar"><i id="fill" style="width:0"></i></div>
  </section>

  <section class="card">
    <div class="hint" id="statTitle" style="margin:0 0 10px"></div>
    <div class="grid">
      <div class="stat"><b id="perDay">0원</b><span>기간 기준 하루 평균</span></div>
      <div class="stat"><b id="left">0원</b><span>남은 돈</span></div>
      <div class="stat"><b id="spent">0원</b><span>쓴 돈</span></div>
      <div class="stat"><b id="days">0일</b><span>남은 날 (오늘 포함)</span></div>
    </div>
  </section>

  <section class="card">
    <div class="seg"><button type="button" id="kOut" class="on">지출</button><button type="button" id="kIn">추가 수입</button></div>
    <label for="memo" id="recLabel">오늘 쓴 돈 기록하기</label>
    <div class="row" style="margin-bottom:8px">
      <input id="memo" placeholder="메모 (점심, 커피…)" maxlength="30">
    </div>
    <div class="row">
      <input id="amt" inputmode="numeric" placeholder="금액 (원)" autocomplete="off">
      <button id="addBtn" type="button">추가</button>
      <button class="ghost" id="cancelBtn" type="button" style="display:none">취소</button>
    </div>
    <ul id="list"></ul>
    <p class="empty" id="empty"></p>
  </section>

  <div style="text-align:center"><button class="ghost" id="reset" type="button">지출 기록 전체 초기화</button></div>
</main>
<script>
(function(){
  var KEY="gagyebu-v2", DAY=86400000;
  var $=function(id){return document.getElementById(id)};
  var fmt=function(n){return Math.round(n).toLocaleString("ko-KR")};
  var num=function(s){return parseInt(String(s).replace(/[^0-9]/g,""),10)||0};
  var pad=function(n){return n<10?"0"+n:""+n};
  var iso=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
  var parse=function(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
  var diff=function(a,b){return Math.round((parse(b)-parse(a))/DAY)};
  var addDays=function(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
  var label=function(s){var d=parse(s);return (d.getMonth()+1)+"월 "+d.getDate()+"일"};
  var md=function(s){var d=parse(s);return (d.getMonth()+1)+"/"+d.getDate()};

  var now=new Date(), todayS=iso(now);
  var st={periods:[{id:1,budget:0,start:iso(new Date(now.getFullYear(),now.getMonth(),1)),end:iso(new Date(now.getFullYear(),now.getMonth()+1,0))}],items:[]};
  try{
    var r=localStorage.getItem(KEY);
    if(r){
      var p=JSON.parse(r);
      if(p&&p.periods&&p.periods.length){st=p;st.items=st.items||[];}
      else if(p&&p.start&&p.end){st={periods:[{id:1,budget:p.budget||0,start:p.start,end:p.end}],items:p.items||[]};}
    }
  }catch(e){}
  st.periods.forEach(function(P){if(P.carryIn)P.budget+=P.carryIn;delete P.carryIn;delete P.carriedTo;delete P.carriedAmt;});
  function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}

  function periodAt(s){var b=null;st.periods.forEach(function(P){if(P.start<=s&&s<=P.end&&(!b||P.start>b.start))b=P});return b}
  function ptotal(P){return Math.max(diff(P.start,P.end)+1,1)}
  function pbase(P){return Math.floor(P.budget/ptotal(P))}
  function sum(lo,hi){var t=0;st.items.forEach(function(it){if(!it.k&&it.d>=lo&&it.d<hi)t+=it.a});return t}
  function spentIn(P){return sum(P.start,addDays(P.end,1))}
  function incs(P,upTo){return st.items.filter(function(it){return it.k==="in"&&it.d>=P.start&&it.d<=P.end&&it.d<=upTo})}
  function incTotal(P){return incs(P,P.end).reduce(function(t,it){return t+it.a},0)}
  function eff(P){return P.budget+incTotal(P)}
  function allowOn(P,s){
    var inc=incs(P,s).reduce(function(t,it){var R=diff(it.d,P.end)+1;return t+Math.floor(it.a/R)*(s>todayS?1:diff(it.d,s)+1)},0);
    return s>todayS?pbase(P)+inc:pbase(P)*(diff(P.start,s)+1)-sum(P.start,s)+inc;
  }
  function sorted(){return st.periods.slice().sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:0})}

  var cur0=periodAt(todayS)||sorted()[sorted().length-1];
  var selId=cur0.id, sel=todayS, editId=null, formErr="", kind="out";
  var view=new Date(now.getFullYear(),now.getMonth(),1);
  function getSel(){for(var i=0;i<st.periods.length;i++)if(st.periods[i].id===selId)return st.periods[i];selId=st.periods[0].id;return st.periods[0];}
  function loadForm(){var P=getSel();$("budget").value=P.budget?fmt(P.budget):"";$("start").value=P.start;$("end").value=P.end;formErr="";}
  function stopEdit(){editId=null;$("amt").value="";$("memo").value="";}
  function jump(s){var d=parse(s);view=new Date(d.getFullYear(),d.getMonth(),1);}
  function short(a){var n=Math.abs(a),s=n>=10000?(Math.round(n/1000)/10)+"만":fmt(n);return a<0?"-"+s:s}

  function armed(btn,txt){
    if(btn.dataset.armed){clearTimeout(btn._t);btn.textContent=btn.dataset.orig;delete btn.dataset.armed;return true;}
    btn.dataset.orig=btn.textContent;btn.dataset.armed="1";btn.textContent=txt;
    btn._t=setTimeout(function(){btn.textContent=btn.dataset.orig;delete btn.dataset.armed;},4000);
    return false;
  }
  function commaInput(el){el.addEventListener("input",function(){var n=num(el.value);el.value=n?fmt(n):""})}
  commaInput($("budget"));commaInput($("amt"));

  function render(){
    var cur=periodAt(todayS), sp=getSel(), sub="", allow=0, todaySpent=0, todayLeft=0, hasB=!!(cur&&eff(cur));
    st.items.forEach(function(it){if(it.d===todayS&&!it.k)todaySpent+=it.a});
    if(!cur){sub="오늘이 들어가는 기간이 없어요. 아래에서 기간을 추가해 주세요";}
    else if(!hasB){sub="이 기간의 생활비를 입력해 주세요";}
    else{
      allow=allowOn(cur,todayS);todayLeft=allow-todaySpent;
      var remainC=eff(cur)-spentIn(cur), base=pbase(cur), cr=allow-base, leftD=diff(todayS,cur.end)+1;
      if(remainC<0)sub="이 기간 생활비를 "+fmt(-remainC)+"원 넘게 썼어요";
      else if(todayLeft<0)sub="오늘 "+fmt(-todayLeft)+"원 초과했어요. 초과분은 내일 한도에서 빠져요";
      else sub="오늘 한도 "+fmt(allow)+"원"+(cr>0?" (이월·추가 수입 포함 "+fmt(cr)+"원)":cr<0?" (초과분 "+fmt(-cr)+"원 차감)":"")+" 중 "+fmt(todaySpent)+"원 사용."+(todayLeft>0&&leftD>1?" 남은 "+fmt(todayLeft)+"원은 내일로 이월돼요":"");
    }
    $("today").textContent=hasB?fmt(Math.max(todayLeft,0)):"0";
    $("hero").classList.toggle("over",hasB&&todayLeft<0);
    $("todaySub").textContent=sub;
    $("fill").style.width=(hasB&&allow>0?Math.min(100,Math.max(0,todaySpent/allow*100)):0)+"%";

    var total=ptotal(sp), spentP=spentIn(sp), remain=eff(sp)-spentP;
    var daysLeft=todayS<sp.start?total:todayS>sp.end?0:diff(todayS,sp.end)+1;
    $("statTitle").textContent=md(sp.start)+" ~ "+md(sp.end)+" 기간 ("+total+"일)"+(incTotal(sp)?" · 추가 수입 "+fmt(incTotal(sp))+"원 포함":"");
    $("perDay").textContent=fmt(eff(sp)/total)+"원";
    $("left").textContent=fmt(remain)+"원";
    $("left").parentNode.classList.toggle("w",remain<0);
    $("spent").textContent=fmt(spentP)+"원";
    $("days").textContent=daysLeft+"일";

    var sel$=$("periodSel");sel$.innerHTML="";
    sorted().forEach(function(P){
      var o=document.createElement("option");o.value=P.id;
      o.textContent=md(P.start)+" ~ "+md(P.end)+" · "+fmt(P.budget)+"원";
      if(P.id===sp.id)o.selected=true;sel$.appendChild(o);
    });
    var info=$("periodInfo");info.className="hint";
    if(formErr){info.className="hint err";info.textContent=formErr;}
    else{
      var ov=st.periods.some(function(Q){return Q.id!==sp.id&&Q.start<=sp.end&&Q.end>=sp.start});
      info.textContent=label(sp.start)+" ~ "+label(sp.end)+", 총 "+total+"일"+(ov?". 다른 기간과 겹쳐요. 겹친 날은 나중에 시작한 기간으로 계산돼요":"");
      if(ov)info.className="hint err";
    }

    var ul=$("list");ul.innerHTML="";
    st.items.filter(function(it){return it.d===sel}).reverse().forEach(function(it){
      var li=document.createElement("li");
      var m=document.createElement("div");m.className="m";
      var t=document.createElement("div");t.textContent=it.m||(it.k?"추가 수입":"지출");
      var d=document.createElement("div");d.className="d";d.textContent=label(it.d);
      m.appendChild(t);m.appendChild(d);
      var a=document.createElement("div");a.className="a"+(it.k?" in":"");a.textContent=(it.k?"+":"")+fmt(it.a)+"원";
      var x=document.createElement("button");x.className="ghost";x.type="button";x.textContent="삭제";
      x.addEventListener("click",function(){if(editId===it.id)stopEdit();st.items=st.items.filter(function(i){return i.id!==it.id});save();render();});
      var ed=document.createElement("button");ed.className="ghost";ed.type="button";ed.textContent="수정";
      ed.addEventListener("click",function(){editId=it.id;kind=it.k?"in":"out";$("amt").value=fmt(it.a);$("memo").value=it.m||"";render();$("amt").focus();});
      li.appendChild(m);li.appendChild(a);li.appendChild(ed);li.appendChild(x);ul.appendChild(li);
    });
    var selName=sel===todayS?"오늘":label(sel);
    $("empty").style.display=ul.children.length?"none":"block";
    $("empty").textContent=selName+" 쓴 기록이 없어요. 금액을 추가하면 이후 날짜의 한도가 다시 계산돼요.";
    $("recLabel").textContent=(kind==="in"?selName+" 추가 수입 (수입일부터 기간 끝까지 나눠요)":selName+" 쓴 돈 기록하기")+(editId?" (수정 중)":"");
    $("kOut").className=kind==="in"?"":"on";$("kIn").className=kind==="in"?"on":"";
    $("memo").placeholder=kind==="in"?"메모 (용돈, 환급…)":"메모 (점심, 커피…)";
    $("addBtn").textContent=editId?"저장":"추가";
    $("cancelBtn").style.display=editId?"":"none";
    drawCal();drawDetail();
  }

  function drawDetail(){
    var box=$("detail");box.innerHTML="";
    var P=periodAt(sel), t0=document.createElement("div");
    t0.className="dt-t";t0.textContent=label(sel)+(sel===todayS?" (오늘)":"");box.appendChild(t0);
    function row(cls,l,v,vc){var r=document.createElement("div");r.className="dr "+cls;var a=document.createElement("span");a.textContent=l;var b=document.createElement("b");b.textContent=v;if(vc)b.className=vc;r.appendChild(a);r.appendChild(b);box.appendChild(r);}
    if(!P||!eff(P)){var h=document.createElement("div");h.className="hint";h.style.margin="0";h.textContent="이 날짜는 생활비가 정해진 기간에 포함되지 않아요.";box.appendChild(h);return;}
    var spent=0, inc=0;
    st.items.forEach(function(it){if(it.d===sel){if(it.k)inc+=it.a;else spent+=it.a;}});
    var allow=allowOn(P,sel), base=pbase(P), extra=allow-base, future=sel>todayS;
    row("big",future?"쓸 수 있는 돈 (예상)":"쓸 수 있는 돈",fmt(allow)+"원");
    row("sub","기본 하루 금액",fmt(base)+"원");
    var incPart=incs(P,sel).reduce(function(t,it){var R=diff(it.d,P.end)+1;return t+Math.floor(it.a/R)},0), carry=extra-incPart;
    if(incPart)row("sub","추가 수입 분","+"+fmt(incPart)+"원");
    if(carry>0)row("sub","지난 날 남은 돈 이월","+"+fmt(carry)+"원");
    if(carry<0)row("sub","지난 날 초과분 차감",fmt(carry)+"원");
    if(spent)row("","쓴 돈","-"+fmt(spent)+"원","w");
    if(inc)row("","추가 수입 기록","+"+fmt(inc)+"원","g");
    if(!future)row("big",sel===P.end?"남은 돈":(sel===todayS?"오늘 남은 돈 (내일로 이월)":"그날 남은 돈"),fmt(allow-spent)+"원",allow-spent<0?"w":"");
  }

  function drawCal(){
    var y=view.getFullYear(), m=view.getMonth();
    $("calTitle").textContent=y+"년 "+(m+1)+"월";
    var first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate(), sums={};
    var ins={};st.items.forEach(function(it){if(it.k)ins[it.d]=(ins[it.d]||0)+it.a;else sums[it.d]=(sums[it.d]||0)+it.a});
    var g=$("calGrid");g.innerHTML="";
    for(var i=0;i<first;i++)g.appendChild(document.createElement("div"));
    for(var d=1;d<=n;d++){
      var s=y+"-"+pad(m+1)+"-"+pad(d), c=document.createElement("div"), cls="cd", P=periodAt(s);
      if(P)cls+=" p";
      if(st.periods.some(function(Q){return Q.start===s||Q.end===s}))cls+=" e";
      if(s===todayS)cls+=" t";
      if(s===sel)cls+=" s";
      c.className=cls;c.tabIndex=0;c.setAttribute("role","button");
      (function(ds){
        var pick=function(){sel=ds;var Q=periodAt(ds);if(Q&&Q.id!==selId){selId=Q.id;loadForm();}stopEdit();render();};
        c.addEventListener("click",pick);
        c.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}});
      })(s);
      var n1=document.createElement("span");n1.textContent=d;c.appendChild(n1);
      if(P&&eff(P)){var e1=document.createElement("em");var rem=allowOn(P,s)-(sums[s]||0);e1.textContent=short(rem);if(rem<0)e1.style.color="var(--warn)";if(s>todayS)e1.style.opacity=".6";c.appendChild(e1);}
      if(sums[s]||ins[s]){var dt=document.createElement("div");dt.className="dots";if(sums[s]){var d1=document.createElement("span");d1.className="dt";dt.appendChild(d1);}if(ins[s]){var d2=document.createElement("span");d2.className="dt in";dt.appendChild(d2);}c.appendChild(dt);}
      
      g.appendChild(c);
    }
  }

  $("calPrev").addEventListener("click",function(){view=new Date(view.getFullYear(),view.getMonth()-1,1);drawCal();});
  $("calNext").addEventListener("click",function(){view=new Date(view.getFullYear(),view.getMonth()+1,1);drawCal();});

  function apply(){
    var P=getSel(), ns=$("start").value, ne=$("end").value;
    if(!ns||!ne)return;
    if(ne<ns){formErr="종료일이 시작일보다 빠를 수 없어요. 날짜를 다시 골라 주세요.";render();return;}
    formErr="";P.budget=num($("budget").value);P.start=ns;P.end=ne;
    save();render();
  }
  $("setBtn").addEventListener("click",apply);
  $("start").addEventListener("change",apply);
  $("end").addEventListener("change",apply);
  $("budget").addEventListener("keydown",function(e){if(e.key==="Enter")apply()});
  $("periodSel").addEventListener("change",function(){selId=Number($("periodSel").value);loadForm();jump(getSel().start);render();});
  $("addPeriod").addEventListener("click",function(){
    var last=st.periods.reduce(function(a,P){return P.end>a?P.end:a},"0000-00-00");
    var s=addDays(last,1), e=addDays(s,29), P={id:Date.now(),budget:0,start:s,end:e};
    st.periods.push(P);selId=P.id;loadForm();jump(s);save();render();$("budget").focus();
  });
  $("delPeriod").addEventListener("click",function(){
    if(st.periods.length<2){formErr="기간은 최소 하나는 있어야 해요.";render();return;}
    if(!armed($("delPeriod"),"한 번 더 누르면 삭제"))return;
    st.periods=st.periods.filter(function(P){return P.id!==selId});
    selId=(periodAt(todayS)||sorted()[sorted().length-1]).id;loadForm();save();render();
  });
  $("cancelBtn").addEventListener("click",function(){stopEdit();render();});
  $("addBtn").addEventListener("click",function(){
    var a=num($("amt").value);
    if(!a){$("amt").focus();return;}
    if(editId){st.items.forEach(function(it){if(it.id===editId){it.a=a;it.m=$("memo").value.trim();}});}
    else{var o={id:Date.now(),d:sel,a:a,m:$("memo").value.trim()};if(kind==="in")o.k="in";st.items.push(o);}
    stopEdit();save();render();
  });
  $("amt").addEventListener("keydown",function(e){if(e.key==="Enter")$("addBtn").click()});
  $("reset").addEventListener("click",function(){
    if(!armed($("reset"),"한 번 더 누르면 모두 삭제돼요"))return;
    st.items=[];stopEdit();save();render();
  });
  $("kOut").addEventListener("click",function(){kind="out";stopEdit();render();});
  $("kIn").addEventListener("click",function(){kind="in";stopEdit();render();});
  loadForm();render();
})();
</script>
</body>
</html>
